name: Migrate
# Applies supabase/migrations: a push to `dev` migrates the dev project, a push to `main`
# migrates production (#67). A manual run migrates the project of the branch it runs on.
on:
  push:
    branches: [dev, main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
concurrency:
  group: migrate
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_PASSWORD || secrets.SUPABASE_DEV_DB_PASSWORD }}
      PROJECT_REF: ${{ github.ref_name == 'main' && vars.SUPABASE_PROJECT_REF || vars.SUPABASE_DEV_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
      - run: supabase db push -p "$SUPABASE_DB_PASSWORD" --yes
